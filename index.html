    }
    ::-webkit-scrollbar-thumb {

    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.55);
    }

    }

  <script>
    /********************************************************************
     * AITU STUDENT CALCULATOR — CORE STATE & MATHEMATICAL ENGINE
     ********************************************************************/
    const STORAGE_KEY = 'aitu_student_calculator_v1';
    const ACCOUNT_OWNER_KEY = 'aitu_student_active_owner_v1';
    const USER_STATE_PREFIX = 'aitu_student_local_user_';
    const SUPABASE_CONFIG_KEY = 'aitu_student_cloud_config_v2';
    const DEFAULT_SUPABASE_URL = 'https://mrbrromdzjecidqgycux.supabase.co';
    const DEFAULT_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_o11WeK5u4-1V0PnGJ3oeCA_RdB5EjcY';
    const TODAY_ISO = '2026-11-10'; // Current local date from metadata (Tuesday of Week 8)

    function loadSupabaseConfig() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(SUPABASE_CONFIG_KEY) || '{}') || {}; }
      catch (e) { console.warn('Supabase config read error:', e); }
      return {
        url: DEFAULT_SUPABASE_URL,
        anonKey: DEFAULT_SUPABASE_PUBLISHABLE_KEY,
        studentId: saved.studentId || '',
        enabled: false // Cloud access starts only after a valid Auth session.
      };
    }

    let supabaseConfig = loadSupabaseConfig();
    let syncTimeoutId = null;
    let supabaseClient = null;
    let currentAuthUser = null;
    let realtimeChannel = null;

    function saveSupabaseConfig(cfg) {
      // Project credentials are fixed for this published app; users never enter them.
      supabaseConfig = {
        ...cfg,
        url: DEFAULT_SUPABASE_URL,
        anonKey: DEFAULT_SUPABASE_PUBLISHABLE_KEY,
        enabled: Boolean(currentAuthUser && cfg.enabled),
        studentId: currentAuthUser ? (currentAuthUser.email || currentAuthUser.id) : ''
      };
      try { localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify(supabaseConfig)); }
      catch (e) { console.warn('Supabase config write error:', e); }
      updateAccountHeaderBadge();
    }

    function updateAccountHeaderBadge() {
      const lbl = document.getElementById('accountHeaderLabel');
      const badgeText = document.getElementById('saveStatusText');
      if (currentAuthUser && currentAuthUser.email) {
        if (lbl) lbl.textContent = currentAuthUser.email.split('@')[0];
        if (badgeText) badgeText.textContent = 'Live Sync Active';
      } else if (supabaseConfig && supabaseConfig.enabled && supabaseConfig.url && supabaseConfig.anonKey) {
        if (lbl) lbl.textContent = supabaseConfig.studentId || 'Cloud Linked';
      } else {
        if (lbl) lbl.textContent = 'Account & Sync';
      }
    }

    async function initSupabaseClient() {
      if (!window.supabase || !supabaseConfig.url || !supabaseConfig.anonKey) {
        updateAccountHeaderBadge();
        return null;
      }
      try {
        if (!supabaseClient) {
          supabaseClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey);
        }
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        currentAuthUser = data?.session?.user || null;
        if (currentAuthUser) activateAccountState(currentAuthUser);
        supabaseConfig.enabled = Boolean(currentAuthUser);
        supabaseConfig.studentId = currentAuthUser?.email || '';
        updateAccountHeaderBadge();
        if (currentAuthUser) subscribeToRealtimeSync();
        return supabaseClient;
      } catch (err) {
        console.warn('Supabase client init warning:', err);
        currentAuthUser = null;
        supabaseConfig.enabled = false;
        updateAccountHeaderBadge();
        return null;
      }
    }

    function subscribeToRealtimeSync() {
      if (!supabaseClient || !currentAuthUser?.id) return;
      try {
        if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
        realtimeChannel = supabaseClient
          .channel('aitu_student_sync_' + currentAuthUser.id)
          .on('postgres_changes', {
            event: '*', schema: 'public', table: 'aitu_student_profiles',
            filter: `user_id=eq.${currentAuthUser.id}`
          }, (payload) => {
            if (payload?.new?.user_id === currentAuthUser?.id && payload.new.app_state) {
              appState = payload.new.app_state;
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                localStorage.setItem(USER_STATE_PREFIX + currentAuthUser.id, JSON.stringify(appState));
              } catch (e) {}
              renderApp();
              const badge = document.getElementById('saveStatusText');
              if (badge) badge.textContent = 'Synced across devices';
            }
          }).subscribe();
      } catch (err) { console.warn('Realtime subscription warning:', err); }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && currentAuthUser?.id) pullStateFromSupabase(true);
    });

    async function pushStateToSupabase(silent = true) {
      if (!supabaseClient || !currentAuthUser?.id || !supabaseConfig.enabled) return false;
      const badge = document.getElementById('saveStatusText');
      if (badge) badge.textContent = 'Syncing...';
      try {
        const { error } = await supabaseClient.from('aitu_student_profiles').upsert({
          student_id: currentAuthUser.email || currentAuthUser.id,
          user_id: currentAuthUser.id,
          app_state: appState,
          updated_at: new Date().toISOString()
        }, { onConflict: 'student_id' });
        if (error) throw error;
        if (badge) badge.textContent = 'Cloud Synced';
        if (!silent) showToast('Synced student data to Supabase!', 'success');
        return true;
      } catch (err) {
        console.warn('Supabase push failed:', err);
        if (badge) badge.textContent = 'Saved Locally (Cloud Offline)';
        if (!silent) showToast('Cloud sync failed. Check account access and RLS.', 'error');
        return false;
      }
    }

    async function pullStateFromSupabase(silent = false) {
      if (!supabaseClient || !currentAuthUser?.id) {
        if (!silent) showToast('Sign in to load your cloud data.', 'error');
        return false;
      }
      try {
        const { data, error } = await supabaseClient.from('aitu_student_profiles')
          .select('app_state,updated_at').eq('user_id', currentAuthUser.id).maybeSingle();
        if (error) throw error;
        if (data?.app_state) {
          appState = data.app_state;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          localStorage.setItem(USER_STATE_PREFIX + currentAuthUser.id, JSON.stringify(appState));
          renderApp();
          if (!silent) showToast('Loaded your data from Supabase!', 'success');
        } else {
          if (!silent) showToast('No cloud profile yet. Saving your local data.', 'info');
          return await pushStateToSupabase(silent);
        }
        return true;
      } catch (err) {
        console.warn('Supabase pull failed:', err);
        if (!silent) showToast('Could not load your cloud profile.', 'error');
        return false;
      }

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.subjects) && Array.isArray(parsed.timetable)) {
            return parsed;
          }
        }
      } catch (err) {
        console.warn('LocalStorage read fallback:', err);
      }
      return getDefaultState();
    }

    function activateAccountState(user) {
      if (!user?.id) return;
      if (syncTimeoutId) clearTimeout(syncTimeoutId);
      const previousOwner = localStorage.getItem(ACCOUNT_OWNER_KEY);
      if (previousOwner && previousOwner !== user.id && previousOwner !== 'signed_out') {
        localStorage.setItem(USER_STATE_PREFIX + previousOwner, JSON.stringify(appState));
      }
      if (previousOwner !== user.id) {
        const stored = localStorage.getItem(USER_STATE_PREFIX + user.id);
        if (stored) {
          try { appState = JSON.parse(stored); } catch (e) { appState = getDefaultState(); }
        } else if (previousOwner) {
          appState = getDefaultState();
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        renderApp();
      }
      localStorage.setItem(ACCOUNT_OWNER_KEY, user.id);
    }

    function saveState(toastMsg = null) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (currentAuthUser?.id) localStorage.setItem(USER_STATE_PREFIX + currentAuthUser.id, JSON.stringify(appState));
        const badgeText = document.getElementById('saveStatusText');
        if (badgeText) {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          badgeText.textContent = `Saved ${hh}:${mm}`;
        }
      } catch (err) {
        console.warn('LocalStorage write fallback:', err);
      }
      if (supabaseConfig && supabaseConfig.enabled && supabaseConfig.url && supabaseConfig.anonKey) {
        if (syncTimeoutId) clearTimeout(syncTimeoutId);
        syncTimeoutId = setTimeout(() => { pushStateToSupabase(true); }, 600);
      }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      const borderColor = type === 'error'
        ? 'border-rose-500/40 bg-rose-950/90 text-rose-100'
        : type === 'success'
        ? 'border-emerald-500/40 bg-slate-900/95 text-white'
        : 'border-slate-700 bg-slate-900/95 text-slate-100';
      el.className = `px-3.5 py-2 rounded-lg border text-xs font-medium shadow-lg backdrop-blur fade-in flex items-center gap-2 ${borderColor}`;
      el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${type === 'error' ? 'bg-rose-400' : 'bg-emerald-400'}"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function round1(num) {
      return Math.round((Number(num) + Number.EPSILON) * 10) / 10;
    }

    function round2(num) {
      return Math.round((Number(num) + Number.EPSILON) * 100) / 100;
    }

    /********************************************************************
     * DATE & TIMETABLE SESSION GENERATOR
     ********************************************************************/
    function parseISODate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, d));
    }

    function formatISODate(dateObj) {
      const y = dateObj.getUTCFullYear();
      const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatShortDate(iso) {
      if (!iso) return '';
      const d = parseISODate(iso);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${months[d.getUTCMonth()]} ${d.getUTCDate()}`;
    }

    function addDaysISO(iso, days) {
      const d = parseISODate(iso);
      d.setUTCDate(d.getUTCDate() + days);
      return formatISODate(d);
    }

    // Align semester start date to the Monday of its week so Week 1..N Mon-Sat grid is exact
    function getMondayOfISO(iso) {
      const d = parseISODate(iso);
      const day = d.getUTCDay(); // 0 = Sun, 1 = Mon, ...
      const diff = day === 0 ? -6 : 1 - day;
      d.setUTCDate(d.getUTCDate() + diff);
      return formatISODate(d);
    }

    function formatEndTime(startTime, durationHours) {
      if (!startTime || !startTime.includes(':')) return '';
      const [hh, mm] = startTime.split(':').map(Number);
      const endH = (hh + Number(durationHours)) % 24;
      return `${String(endH).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    }

    // Resolve whether a date falls in one or more holidays and determine the effective override for a specific class slot
    // Prevents duplicate exclusions when multiple holidays overlap on the same date!
    function resolveHolidayForClass(slot, dateISO) {
      const matchingHolidays = appState.holidays.filter(h => dateISO >= h.startDate && dateISO <= h.endDate);
      if (matchingHolidays.length === 0) {
        return { isHoliday: false, mode: 'normal', holidayNames: [], holidays: [] };
      }

      const key = `${slot.id}__${dateISO}`;
      let effectiveMode = null;

      // Priority 1: Explicit per-class override on the most recent matching holiday
      for (let i = matchingHolidays.length - 1; i >= 0; i--) {
        const h = matchingHolidays[i];
        if (h.classOverrides && h.classOverrides[key]) {
          effectiveMode = h.classOverrides[key];
          break;
        }
      }

      // Priority 2: Subject-level setting on the matching holiday
      if (!effectiveMode) {
        for (let i = matchingHolidays.length - 1; i >= 0; i--) {
          const h = matchingHolidays[i];
          if (h.subjectSettings && h.subjectSettings[slot.subjectId]) {
            effectiveMode = h.subjectSettings[slot.subjectId];
            break;
          }
        }
      }

      // Default to 'normal' if not explicitly set to 'free' or 'excluded' (per prompt: "Do not automatically cancel or exclude all subjects just because a date is marked as a holiday")
      if (!effectiveMode) {
        effectiveMode = 'normal';
      }

      return {
        isHoliday: true,
        mode: effectiveMode, // 'free' | 'excluded' | 'normal'
        holidayNames: matchingHolidays.map(h => h.name),
        holidays: matchingHolidays
      };
    }

    // Generate all scheduled class instances across the semester
    function generateAllSessions() {
      const weeks = Math.max(1, Math.min(24, Number(appState.semester.weeks) || 10));
      const baseMonday = getMondayOfISO(appState.semester.startDate || '2026-09-21');
      const refDate = appState.semester.referenceDate || TODAY_ISO;
      const sessions = [];
      const seenKeys = new Set(); // Guard against duplicate records

      for (let w = 1; w <= weeks; w++) {
        const weekMonday = addDaysISO(baseMonday, (w - 1) * 7);
        for (const slot of appState.timetable) {
          const dayIdx = DAYS_OF_WEEK.indexOf(slot.dayOfWeek);
          if (dayIdx === -1) continue;
          const dateISO = addDaysISO(weekMonday, dayIdx);

          // Check custom semester endDate boundary if set
          if (appState.semester.endDate && dateISO > appState.semester.endDate) {
            continue;
          }

          const instanceKey = `${slot.id}__${dateISO}`;
          if (seenKeys.has(instanceKey)) continue;
          seenKeys.add(instanceKey);

          // Underlying normal status preserved internally even when holiday overrides apply
          let normalStatus = appState.attendanceRecords[instanceKey];
          if (!normalStatus) {
            normalStatus = dateISO < refDate ? 'Attended' : 'Upcoming';
          }

          const holidayInfo = resolveHolidayForClass(slot, dateISO);

          // Effective status for display & math
          let effectiveStatus = normalStatus;
          if (holidayInfo.isHoliday && holidayInfo.mode === 'free') {
            effectiveStatus = 'Free Attendance';
          } else if (holidayInfo.isHoliday && holidayInfo.mode === 'excluded') {
            effectiveStatus = 'Not Counted';
          }

          sessions.push({
            key: instanceKey,
            slotId: slot.id,
            subjectId: slot.subjectId,
            week: w,
            dayOfWeek: slot.dayOfWeek,
            dateISO,
            startTime: slot.startTime,
            endTime: formatEndTime(slot.startTime, slot.duration),
            duration: Number(slot.duration) || 1,
            classType: slot.classType || 'Lecture',
            classroom: slot.classroom || '',
            normalStatus,      // 'Attended' | 'Missed' | 'Upcoming' (preserved internally!)
            effectiveStatus,   // 'Attended' | 'Missed' | 'Upcoming' | 'Free Attendance' | 'Not Counted'
            isHoliday: holidayInfo.isHoliday,
            holidayMode: holidayInfo.mode,
            holidayNames: holidayInfo.holidayNames
          });
        }
      }

      // Sort chronologically
      sessions.sort((a, b) => {
        if (a.dateISO !== b.dateISO) return a.dateISO.localeCompare(b.dateISO);
        return a.startTime.localeCompare(b.startTime);
      });

      return sessions;
    }

    /********************************************************************
     * 1. TWO-STEP SCHOLARSHIP GRADE CALCULATOR ENGINE
     ********************************************************************/
    function calculateSubjectGrade(subject, scenarioOverrides = null) {
      let componentWeightSum = 0;
      let totalCoursePointsEarned = 0; // Sum of Step 2 points across all components
      let totalCourseWeightGraded = 0; // How much of the 100% course has been graded so far
      let totalCompletedAssessments = 0;
      let totalPendingAssessments = 0;
      let hasInvalidAssessmentWeights = false;
      let hasOutOfRangeScores = false;

      const componentResults = subject.components.map(comp => {
        const compWeight = Number(comp.weight) || 0;
        componentWeightSum += compWeight;

        let assessmentWeightSum = 0;
        let gradedAssessmentWeightSum = 0;
        let step1ComponentPercent = 0; // Step 1: sum of (score * assessmentWeight / 100)

        const assessmentsDetailed = (comp.assessments || []).map(ass => {
          const aWeight = Number(ass.weight) || 0;
          assessmentWeightSum += aWeight;

          // Determine score (actual or scenario override)
          let rawScore = ass.score;
          let isScenario = false;
          if (scenarioOverrides) {
            if (scenarioOverrides.assessmentOverrides && scenarioOverrides.assessmentOverrides[ass.id] !== undefined && scenarioOverrides.assessmentOverrides[ass.id] !== '') {
              rawScore = Number(scenarioOverrides.assessmentOverrides[ass.id]);
              isScenario = true;
            } else if ((rawScore === null || rawScore === undefined || rawScore === '') && scenarioOverrides.uniformScore !== null && scenarioOverrides.uniformScore !== undefined && scenarioOverrides.uniformScore !== '') {
              rawScore = Number(scenarioOverrides.uniformScore);
              isScenario = true;
            }
          }

          const isGraded = rawScore !== null && rawScore !== undefined && rawScore !== '' && !Number.isNaN(Number(rawScore));
          const numericScore = isGraded ? Number(rawScore) : null;

          if (isGraded && (numericScore < 0 || numericScore > 100)) {
            hasOutOfRangeScores = true;
          }

          // Step 1 calculation for this assessment: Score * (AssessmentWeight / 100)
          const contributionToComponent = isGraded ? (numericScore * (aWeight / 100)) : 0;
          // Effective course points from this single assessment: contributionToComponent * (compWeight / 100)
          const contributionToCoursePoints = contributionToComponent * (compWeight / 100);
          const effectiveCourseWeight = (compWeight * aWeight) / 100;

          if (isGraded) {
            gradedAssessmentWeightSum += aWeight;
            step1ComponentPercent += contributionToComponent;
            totalCourseWeightGraded += effectiveCourseWeight;
            totalCompletedAssessments++;
          } else {
            totalPendingAssessments++;
          }

          return {
            ...ass,
            effectiveScore: numericScore,
            isGraded,
            isScenario,
            contributionToComponent: round2(contributionToComponent),
            contributionToCoursePoints: round2(contributionToCoursePoints),
            effectiveCourseWeight: round2(effectiveCourseWeight)
          };
        });

        if ((comp.assessments || []).length > 0 && Math.abs(assessmentWeightSum - 100) > 0.01) {
          hasInvalidAssessmentWeights = true;
        }

        // Step 2: Calculate component contribution to the overall course grade
        // Reg Mid result (%) * (Reg Mid course weight / 100) = points contributed to overall course grade
        const step2CoursePoints = step1ComponentPercent * (compWeight / 100);
        totalCoursePointsEarned += step2CoursePoints;

        // Normalized average inside component based only on graded assessments
        const normalizedComponentAverage = gradedAssessmentWeightSum > 0
          ? (step1ComponentPercent / (gradedAssessmentWeightSum / 100))
          : null;

        return {
          ...comp,
          weight: compWeight,
          assessmentWeightSum: round1(assessmentWeightSum),
          isAssessmentWeightValid: (comp.assessments || []).length > 0 && Math.abs(assessmentWeightSum - 100) <= 0.01,
          gradedAssessmentWeightSum: round1(gradedAssessmentWeightSum),
          step1ComponentPercent: round2(step1ComponentPercent),
          normalizedComponentAverage: normalizedComponentAverage !== null ? round1(normalizedComponentAverage) : null,
          step2CoursePoints: round2(step2CoursePoints),
          maxComponentPoints: round2(compWeight),
          assessmentsDetailed
        };
      });

      const isComponentWeightValid = Math.abs(componentWeightSum - 100) <= 0.01;
      const remainingCourseWeight = Math.max(0, round2(100 - totalCourseWeightGraded));
      const pointsEarned = round2(totalCoursePointsEarned);

      // Current overall standing on graded portion (so empty scores are NEVER treated as zero!)
      const currentStandingPercent = totalCourseWeightGraded > 0
        ? round1((totalCoursePointsEarned / totalCourseWeightGraded) * 100)
        : null;

      // Points still needed to reach the 70.0-point scholarship threshold
      const pointsNeededFor70 = Math.max(0, round2(70 - totalCoursePointsEarned));

      // Maximum possible final grade if student gets 100% on all remaining assessments
      const maxPossibleFinalGrade = round2(totalCoursePointsEarned + remainingCourseWeight);

      // Required average score (%) across all remaining ungraded assessments to reach 70 points
      let requiredRemainingAverage = null;
      let isTargetPossible = true;

      if (pointsNeededFor70 <= 0) {
        requiredRemainingAverage = 0;
        isTargetPossible = true;
      } else if (remainingCourseWeight <= 0.001) {
        requiredRemainingAverage = null;
        isTargetPossible = false;
      } else {
        requiredRemainingAverage = round1((pointsNeededFor70 / remainingCourseWeight) * 100);
        if (requiredRemainingAverage > 100) {
          isTargetPossible = false;
        }
      }

      // Status classification: Safe (Green), At Risk (Yellow), Below Required / Impossible (Red)
      let status = 'safe'; // 'safe' | 'warning' | 'danger'
      let statusLabel = 'Safe (≥ 70%)';

      if (!isTargetPossible) {
        status = 'danger';
        statusLabel = 'Impossible (< 70% Max)';
      } else if (pointsEarned >= 70) {
        status = 'safe';
        statusLabel = '70% Guaranteed';
      } else if (currentStandingPercent === null) {
        status = 'warning';
        statusLabel = 'No Grades Yet';
      } else if (currentStandingPercent < 70) {
        status = 'danger';
        statusLabel = 'Below 70%';
      } else if (currentStandingPercent < 75 || (requiredRemainingAverage !== null && requiredRemainingAverage > 75)) {
        status = 'warning';
        statusLabel = 'At Risk (Close to 70%)';
      } else {
        status = 'safe';
        statusLabel = 'Safe (≥ 70%)';
      }

      return {
        subjectId: subject.id,
        componentWeightSum: round1(componentWeightSum),
        isComponentWeightValid,
        hasInvalidAssessmentWeights,
        hasOutOfRangeScores,
        pointsEarned, // Overall course points accumulated so far (out of 100)
        totalCourseWeightGraded: round1(totalCourseWeightGraded),
        remainingCourseWeight,
        currentStandingPercent, // Normalized grade on completed assessments (empty != 0)
        pointsNeededFor70,
        maxPossibleFinalGrade,
        requiredRemainingAverage,
        isTargetPossible,
        totalCompletedAssessments,
        totalPendingAssessments,
        status,
        statusLabel,
        componentResults
      };
    }

    /********************************************************************
     * 2. ATTENDANCE HOURS & COMBINATION SOLVER ENGINE
     ********************************************************************/
    function calculateSubjectAttendance(subjectId, allSessions = null) {
      const sessions = (allSessions || generateAllSessions()).filter(s => s.subjectId === subjectId);

      let attendedHours = 0;
      let missedHours = 0;
      let upcomingHours = 0;
      let freeHours = 0;
      let excludedHours = 0;

      let upcoming2hCount = 0;
      let upcoming1hCount = 0;
      const upcomingSessions = [];

      for (const s of sessions) {
        if (s.effectiveStatus === 'Attended') {
          attendedHours += s.duration;
        } else if (s.effectiveStatus === 'Missed') {
          missedHours += s.duration;
        } else if (s.effectiveStatus === 'Upcoming') {
          upcomingHours += s.duration;
          upcomingSessions.push(s);
          if (s.duration === 2) upcoming2hCount++;
          else if (s.duration === 1) upcoming1hCount++;
        } else if (s.effectiveStatus === 'Free Attendance') {
          freeHours += s.duration;
        } else if (s.effectiveStatus === 'Not Counted') {
          excludedHours += s.duration;
        }
      }

      // Total eligible class hours across the semester (excluding Free Attendance and Not Counted)
      const totalEligibleHours = attendedHours + missedHours + upcomingHours;
      const recordedHours = attendedHours + missedHours;

      // Exact Formula required by prompt:
      // Attendance percentage = (Attended hours ÷ (Attended hours + Missed hours)) × 100
      const currentPercentage = recordedHours > 0
        ? round1((attendedHours / recordedHours) * 100)
        : null;

      // End-of-semester 70% threshold calculations based on actual totalEligibleHours:
      // To finish the semester with >= 70%: Attended_final / totalEligibleHours >= 0.70
      const minTotalAttendedForSemester = Math.ceil(0.70 * totalEligibleHours - 1e-9);
      const maxTotalMissedForSemester = Math.max(0, totalEligibleHours - minTotalAttendedForSemester);

      // Minimum future hours the student needs to attend across remaining semester to reach >= 70% at semester end
      const minFutureHoursForSemester70 = Math.max(0, minTotalAttendedForSemester - attendedHours);

      // Maximum additional future hours the student can miss while still reaching >= 70% at semester end
      const maxAdditionalHoursCanMiss = Math.max(0, maxTotalMissedForSemester - missedHours);

      // Immediate recovery hours (if currently below 70%):
      // How many consecutive upcoming hours (x) must be attended with 0 misses so (attended + x) / (attended + missed + x) >= 0.70
      // 0.30 * x >= 0.70 * missed - 0.30 * attended => x >= (7 * missed - 3 * attended) / 3
      let immediateRecoveryHoursNeeded = 0;
      if (recordedHours > 0 && (attendedHours / recordedHours) < 0.70 - 1e-9) {
        immediateRecoveryHoursNeeded = Math.max(0, Math.ceil((7 * missedHours - 3 * attendedHours) / 3 - 1e-9));
      }

      // Is reaching 70% mathematically possible given the actual remaining scheduled hours?
      const maxPossibleFinalAttended = attendedHours + upcomingHours;
      const maxPossibleFinalPercentage = totalEligibleHours > 0
        ? round1((maxPossibleFinalAttended / totalEligibleHours) * 100)
        : 100;
      const isPossibleToReach70 = totalEligibleHours === 0 || (maxPossibleFinalAttended / totalEligibleHours) >= 0.70 - 1e-9;

      // Can recover immediately before semester ends?
      const canRecoverImmediately = immediateRecoveryHoursNeeded <= upcomingHours;

      // Build practical combinations of actual remaining 2-hour and 1-hour classes
      // For the active target (if below 70%, show combinations for BOTH immediate recovery and full-semester 70%; if >= 70%, show combinations for full-semester 70%)
      const activeTargetHours = (currentPercentage !== null && currentPercentage < 70)
        ? immediateRecoveryHoursNeeded
        : minFutureHoursForSemester70;

      const combinationsImmediate = findPracticalClassCombinations( immediateRecoveryHoursNeeded, upcoming2hCount, upcoming1hCount );
      const combinationsSemester = findPracticalClassCombinations( minFutureHoursForSemester70, upcoming2hCount, upcoming1hCount );

      // Status classification
      let status = 'safe';
      let statusLabel = 'Safe (≥ 70%)';
      if (!isPossibleToReach70) {
        status = 'danger';
        statusLabel = 'Impossible (< 70% Max)';
      } else if (currentPercentage !== null && currentPercentage < 70) {
        status = 'danger';
        statusLabel = 'Below 70% — Recovery Needed';
      } else if (currentPercentage !== null && (currentPercentage < 74 || maxAdditionalHoursCanMiss <= 2)) {
        status = 'warning';
        statusLabel = 'At Risk (Low Buffer)';
      }

      return {
        subjectId,
        sessions,
        upcomingSessions,
        totalEligibleHours,
        recordedHours,
        attendedHours,
        missedHours,
        upcomingHours,
        freeHours,
        excludedHours,
        upcoming2hCount,
        upcoming1hCount,
        currentPercentage,
        minTotalAttendedForSemester,
        maxTotalMissedForSemester,
        minFutureHoursForSemester70,
        maxAdditionalHoursCanMiss,
        immediateRecoveryHoursNeeded,
        maxPossibleFinalPercentage,
        isPossibleToReach70,
        canRecoverImmediately,
        activeTargetHours,
        combinationsImmediate,
        combinationsSemester,
        status,
        statusLabel
      };
    }

    // Finds all minimal valid combinations of (k2 two-hour classes, k1 one-hour classes)
    // strictly bounded by the actual remaining classes (avail2h, avail1h) in the student's timetable.
    function findPracticalClassCombinations(targetHours, avail2h, avail1h) {
      if (targetHours <= 0) return [];
      const maxReachable = avail2h * 2 + avail1h * 1;
      if (targetHours > maxReachable) return [];

      const valid = [];
      for (let k2 = avail2h; k2 >= 0; k2--) {
        for (let k1 = 0; k1 <= avail1h; k1++) {
          const totalH = k2 * 2 + k1 * 1;
          if (totalH >= targetHours) {
            // Minimal sufficient check: reducing k1 by 1 or k2 by 1 would drop below targetHours
            const canReduce1 = k1 > 0 && (k2 * 2 + (k1 - 1) >= targetHours);
            const canReduce2 = k2 > 0 && ((k2 - 1) * 2 + k1 >= targetHours);
            if (!canReduce1 && !canReduce2) {
              valid.push({
                k2,
                k1,
                totalHours: totalH,
                totalClasses: k2 + k1,
                label: formatCombinationLabel(k2, k1, totalH)
              });
            }
          }
        }
      }
      return valid;
    }

    function formatCombinationLabel(k2, k1, totalH) {
      const parts = [];
      if (k2 > 0) parts.push(`${k2} two-hour ${k2 === 1 ? 'class' : 'classes'}`);
      if (k1 > 0) parts.push(`${k1} one-hour ${k1 === 1 ? 'class' : 'classes'}`);
      return `Attend ${parts.join(' and ')} (${totalH}h total)`;
    }

    /********************************************************************
     * THEME & NAVIGATION CONTROLLERS
     ********************************************************************/
    function applyTheme() {
      const html = document.documentElement;
      const isDark = appState.theme === 'dark';
      if (isDark) {
        html.classList.add('dark');
        html.classList.remove('light');
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
      }
      const sun = document.getElementById('themeIconSun');
      const moon = document.getElementById('themeIconMoon');
      if (sun && moon) {
        sun.classList.toggle('hidden', !isDark);
        moon.classList.toggle('hidden', isDark);
      }
    }

    function toggleTheme() {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState(`Switched to ${appState.theme === 'dark' ? 'Dark' : 'Light'} Mode`);
    }

    function switchTab(tab, subjectId = null) {
      activeTab = tab;
      if (subjectId) {
        if (tab === 'grades') selectedGradeSubjectId = subjectId;
        if (tab === 'attendance') selectedAttendanceSubjectId = subjectId;
      }

      const views = {
        dashboard: document.getElementById('viewDashboard'),
        grades: document.getElementById('viewGrades'),
        attendance: document.getElementById('viewAttendance'),
        holidays: document.getElementById('viewHolidays'),
        calendar: document.getElementById('viewCalendar')
      };

      Object.keys(views).forEach(k => {
        if (views[k]) {
          views[k].classList.toggle('hidden', k !== tab);
        }
      });

      document.querySelectorAll('.nav-tab').forEach(btn => {
        const isCurrent = btn.getAttribute('data-nav') === tab;
        if (isCurrent) {
          btn.className = 'nav-tab shrink-0 whitespace-nowrap px-3.5 py-1.5 rounded-md text-xs font-semibold bg-white dark:bg-[#242931] text-slate-900 dark:text-white shadow-xs transition-colors';
        } else {
          btn.className = 'nav-tab shrink-0 whitespace-nowrap px-3.5 py-1.5 rounded-md text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 transition-colors';
        }
      });

      renderApp();
    }

    /********************************************************************
     * MASTER RENDER DISPATCHER
     ********************************************************************/
    function renderApp() {
      applyTheme();

      // Ensure selected IDs point to valid subjects
      if (appState.subjects.length > 0) {
        if (!selectedGradeSubjectId || !appState.subjects.some(s => s.id === selectedGradeSubjectId)) {
          selectedGradeSubjectId = appState.subjects[0].id;
        }
        if (!selectedAttendanceSubjectId || !appState.subjects.some(s => s.id === selectedAttendanceSubjectId)) {
          selectedAttendanceSubjectId = appState.subjects[0].id;
        }
      } else {
        selectedGradeSubjectId = null;
        selectedAttendanceSubjectId = null;
      }

      if (appState.holidays.length > 0) {
        if (!selectedHolidayId || !appState.holidays.some(h => h.id === selectedHolidayId)) {
          selectedHolidayId = appState.holidays[0].id;
        }
      } else {
        selectedHolidayId = null;
      }

      // Header badges
      const semBadge = document.getElementById('headerSemesterBadge');
      if (semBadge) {
        semBadge.textContent = `${appState.semester.weeks} Weeks · ${formatShortDate(appState.semester.startDate)} – ${formatShortDate(appState.semester.endDate)}`;
      }
      const footerDate = document.getElementById('footerReferenceDate');
      if (footerDate) {
        footerDate.textContent = `Current Date: ${appState.semester.referenceDate || TODAY_ISO}`;
      }

      const allSessions = generateAllSessions();

      if (activeTab === 'dashboard') {
        renderDashboardView(allSessions);
      } else if (activeTab === 'grades') {
        renderGradesView();
      } else if (activeTab === 'attendance') {
        renderAttendanceView(allSessions);
      } else if (activeTab === 'holidays') {
        renderHolidaysView(allSessions);
      } else if (activeTab === 'calendar') {
        renderCalendarView(allSessions);
      }
    }

     * STATUS BADGE & COLOR HELPERS

      if (status === 'warning') {
        return 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/50 dark:text-amber-300 dark:border-amber-800/70';
      }
      return 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/50 dark:text-rose-300 dark:border-rose-800/70';
    }

      if (status === 'safe') return 'bg-emerald-500 dark:bg-emerald-400';
      if (status === 'warning') return 'bg-amber-500 dark:bg-amber-400';

              <button type="button" onclick="openAddClassSlotModal('${activeSubject ? activeSubject.id : ''}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900">

            <div class="divide-y divide-slate-100 dark:divide-slate-800/80">
              ${DAYS_OF_WEEK.map(day => {
                const daySlots = appState.timetable
                  .filter(t => t.dayOfWeek === day)
                  .sort((a, b) => a.startTime.localeCompare(b.startTime));
                if (daySlots.length === 0) return '';
                return `
                  <div class="p-4 space-y-2.5">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">${day}</div>
                    <div class="space-y-2">
                      ${daySlots.map(slot => {
                        const subj = appState.subjects.find(s => s.id === slot.subjectId);
                        const endTime = formatEndTime(slot.startTime, slot.duration);
                        return `
                          <div class="flex items-center justify-between gap-3 p-3 rounded-lg bg-slate-50 dark:bg-[#14171C] border border-slate-200/70 dark:border-slate-800">
                            <div class="min-w-0">
                              <div class="flex items-center gap-2 flex-wrap">

                                <span class="text-xs font-mono text-slate-600 dark:text-slate-400">${slot.startTime}–${endTime} (${slot.duration} ${slot.duration === 1 ? 'hour' : 'hours'})</span>

                              ${slot.classroom ? `<div class="text-[11px] text-slate-400 mt-0.5">Room / Notes: ${escapeHtml(slot.classroom)}</div>` : ''}
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                              <button type="button" onclick="openEditClassSlotModal('${slot.id}')" class="px-2 py-1 rounded text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800">
                                Edit
                              </button>
                              <button type="button" onclick="confirmDeleteClassSlot('${slot.id}')" class="px-2 py-1 rounded text-xs text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40">
                                Delete
                              </button>
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('') || `<div class="p-8 text-center text-xs text-slate-400">No weekly classes configured. Click "+ Add Class" to create your timetable.</div>`}
            </div>
          </div>

          <!-- Right 6 cols: Generated Class Sessions for Selected Subject -->
          <div class="lg:col-span-6 bg-white dark:bg-[#1C2026] border border-slate-200/80 dark:border-slate-800 rounded-xl overflow-hidden flex flex-col">

              <div>
                <h3 class="text-sm font-semibold text-slate-900 dark:text-white">${activeSubject ? escapeHtml(activeSubject.name) : 'Subject'} — Class Sessions Log</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400">Click any status pill to update Attended, Missed, or Upcoming</p>
              </div>
              <span class="text-xs font-mono text-slate-400">${attReport ? attReport.sessions.length : 0} sessions</span>
            </div>

            <div class="divide-y divide-slate-100 dark:divide-slate-800/80 max-h-[540px] overflow-y-auto">
              ${!attReport || attReport.sessions.length === 0 ? `
                <div class="p-8 text-center text-xs text-slate-400">No scheduled classes for this subject. Add a weekly class slot on the left.</div>
              ` : attReport.sessions.map(sess => `
                <div class="px-4 py-3 flex items-center justify-between gap-3 hover:bg-slate-50/60 dark:hover:bg-slate-800/30">
                  <div class="min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-xs font-mono font-semibold text-slate-500">W${sess.week}</span>
                      <span class="text-xs font-medium text-slate-900 dark:text-white">${sess.dayOfWeek}, ${formatShortDate(sess.dateISO)}</span>
                      <span class="text-xs font-mono text-slate-500">${sess.startTime}–${sess.endTime} (${sess.duration}h)</span>
                      <span class="px-1.5 py-0.5 text-[10px] rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(sess.classType)}</span>
                    </div>
                    ${sess.isHoliday ? `
                      <div class="text-[11px] mt-0.5 ${
                        sess.holidayMode === 'free' ? 'text-blue-600 dark:text-blue-400 font-medium' :
                        sess.holidayMode === 'excluded' ? 'text-slate-500 dark:text-slate-400 font-medium' :
                        'text-emerald-600 dark:text-emerald-400'
                      }">
                        Holiday: ${escapeHtml(sess.holidayNames.join(', '))} (${
                          sess.holidayMode === 'free' ? 'FREE ATTENDANCE — Excluded from denominator' :
                          sess.holidayMode === 'excluded' ? 'EXCLUDED / Cancelled — Not counted' :
                          'Normal Attendance Rules'
                        })
                      </div>
                    ` : ''}
                  </div>

                  <!-- Status Selector Pills -->
                  <div class="flex items-center gap-1 shrink-0">
                    ${sess.effectiveStatus === 'Free Attendance' ? `
                      <span class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-blue-50 dark:bg-blue-950/70 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800">
                        FREE
                      </span>
                      <button type="button" onclick="openSessionDetailModal('${sess.key}')" class="px-2 py-1 rounded text-[11px] text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">Rule</button>
                    ` : sess.effectiveStatus === 'Not Counted' ? `
                      <span class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700">
                        EXCLUDED
                      </span>
                      <button type="button" onclick="openSessionDetailModal('${sess.key}')" class="px-2 py-1 rounded text-[11px] text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">Rule</button>
                    ` : `
                      <button type="button" onclick="updateSessionStatus('${sess.key}', 'Attended')" class="px-2 py-1 rounded text-[11px] font-medium border transition-colors ${
                        sess.normalStatus === 'Attended'
                          ? 'bg-emerald-600 text-white border-emerald-600'
                          : 'bg-transparent text-slate-500 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'
                      }">
                        Attended
                      </button>
                      <button type="button" onclick="updateSessionStatus('${sess.key}', 'Missed')" class="px-2 py-1 rounded text-[11px] font-medium border transition-colors ${
                        sess.normalStatus === 'Missed'
                          ? 'bg-rose-600 text-white border-rose-600'
                          : 'bg-transparent text-slate-500 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'
                      }">
                        Missed
                      </button>
                      <button type="button" onclick="updateSessionStatus('${sess.key}', 'Upcoming')" class="px-2 py-1 rounded text-[11px] font-medium border transition-colors ${
                        sess.normalStatus === 'Upcoming'
                          ? 'bg-slate-700 dark:bg-slate-200 text-white dark:text-slate-900 border-slate-700 dark:border-slate-200'
                          : 'bg-transparent text-slate-500 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'
                      }">
                        Upcoming
                      </button>
                    `}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /********************************************************************
     * VIEW 3: UNIVERSITY HOLIDAYS & NON-TEACHING DAYS
     ********************************************************************/
    function renderHolidaysView(allSessions) {
      const container = document.getElementById('viewHolidays');
      if (!container) return;

      const activeHoliday = appState.holidays.find(h => h.id === selectedHolidayId) || appState.holidays[0];

      // Find all scheduled class instances falling within activeHoliday's date range
      const affectedSessions = activeHoliday
        ? allSessions.filter(s => s.dateISO >= activeHoliday.startDate && s.dateISO <= activeHoliday.endDate)
        : [];

      // Group affected sessions by subjectId
      const affectedSubjectIds = [...new Set(affectedSessions.map(s => s.subjectId))];

      container.innerHTML = `
        <!-- Top Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200/80 dark:border-slate-800">

            <h2 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">University Holidays & Non-Teaching Days</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
              Configure per-subject and per-class attendance rules (<span class="text-blue-600 dark:text-blue-400 font-semibold">FREE</span>, <span class="text-slate-500 font-semibold">EXCLUDED</span>, or <span class="text-emerald-600 dark:text-emerald-400 font-semibold">NORMAL</span>) while preserving original attendance records.
            </p>
          </div>
          <button type="button" onclick="openAddHolidayModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:bg-slate-800">
            <span>+</span>
            <span>Add Holiday / Non-Teaching Day</span>

        </div>

        <!-- Three Options Reference Strip -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-900 dark:text-white">Option A — Free Attendance</span>
              <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-50 dark:bg-blue-950/70 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800">FREE</span>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
              Class takes place, but attendance is optional. Attending or skipping does not count as attended or missed hours. Excluded from the attendance denominator.

          </div>

          <div class="bg-white dark:bg-[#1C2026] border border-slate-200/80 dark:border-slate-800 rounded-xl p-4 space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-900 dark:text-white">Option B — Not Counted (Cancelled)</span>
              <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-300 dark:border-slate-700">EXCLUDED</span>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
              Class is officially cancelled or does not take place. Excluded from the attendance denominator and does not affect attendance percentage.
            </p>
          </div>

          <div class="bg-white dark:bg-[#1C2026] border border-slate-200/80 dark:border-slate-800 rounded-xl p-4 space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-900 dark:text-white">Option C — Normal Attendance</span>
              <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">NORMAL</span>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">

            </p>
          </div>
        </div>

        <!-- Holidays Master-Detail Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Left 4 cols: Holidays List -->
          <div class="lg:col-span-4 space-y-3">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Configured Holidays (${appState.holidays.length})</h3>
            ${appState.holidays.length === 0 ? `
              <div class="bg-white dark:bg-[#1C2026] border border-slate-200 dark:border-slate-800 rounded-xl p-6 text-center text-xs text-slate-500">
                No holidays added yet. Click "+ Add Holiday" to create one.
              </div>

              const isSelected = activeHoliday && h.id === activeHoliday.id;
              const hSessions = allSessions.filter(s => s.dateISO >= h.startDate && s.dateISO <= h.endDate);
              return `
                <div onclick="selectHoliday('${h.id}')" class="cursor-pointer p-4 rounded-xl border transition-all ${
                  isSelected
                    ? 'bg-white dark:bg-[#1C2026] border-slate-900 dark:border-slate-100 shadow-xs'
                    : 'bg-white/70 dark:bg-[#1C2026]/60 border-slate-200 dark:border-slate-800 hover:border-slate-300'
                }">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="px-2 py-0.5 text-[10px] font-medium rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(h.category || 'Holiday')}</span>
                      <h4 class="text-sm font-bold text-slate-900 dark:text-white mt-1">${escapeHtml(h.name)}</h4>
                      <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 tabular-nums">

                    </div>
                  </div>
                </div>

            }).join('')}
          </div>

          <!-- Right 8 cols: Individual Subject & Class Settings for Selected Holiday -->

                    <div class="flex items-center gap-2">
                      <h3 class="text-base font-bold text-slate-900 dark:text-white">${escapeHtml(activeHoliday.name)}</h3>

                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 tabular-nums">

                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[11px] text-slate-400 mr-1">Apply to all on date:</span>

                      All FREE
                    </button>
                    <button type="button" onclick="applyHolidayRuleToAll('${activeHoliday.id}', 'excluded')" class="px-2.5 py-1 rounded text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 hover:bg-slate-200">
                      All EXCLUDED
                    </button>
                    <button type="button" onclick="applyHolidayRuleToAll('${activeHoliday.id}', 'normal')" class="px-2.5 py-1 rounded text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100">
                      Restore All NORMAL
                    </button>
                  </div>
                </div>

                ${affectedSubjectIds.length === 0 ? `
                  <div class="p-6 rounded-xl bg-slate-50 dark:bg-[#14171C] text-center text-xs text-slate-500">
                    No subjects have scheduled classes on ${activeHoliday.startDate === activeHoliday.endDate ? activeHoliday.startDate : `${activeHoliday.startDate} – ${activeHoliday.endDate}`}.
                  </div>
                ` : `
                  <div class="space-y-4">
                    ${affectedSubjectIds.map(subjId => {
                      const subj = appState.subjects.find(s => s.id === subjId);
                      const subjSessions = affectedSessions.filter(s => s.subjectId === subjId);
                      const currentSubjSetting = (activeHoliday.subjectSettings && activeHoliday.subjectSettings[subjId]) || 'normal';

                      return `
                        <div class="p-4 rounded-xl bg-slate-50/80 dark:bg-[#14171C] border border-slate-200/70 dark:border-slate-800 space-y-3">

                                  ? 'bg-emerald-600 text-white border-emerald-600'
                                  : 'bg-white dark:bg-[#1C2026] text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                              }">
                                Normal
                              </button>
                            </div>
                          </div>

                          <!-- Individual Classes for this Subject on this Holiday -->
                          <div class="space-y-2">
                            ${subjSessions.map(sess => {
                              const classOverride = activeHoliday.classOverrides && activeHoliday.classOverrides[sess.key];

                              return `
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-lg bg-white dark:bg-[#1C2026] border border-slate-200/60 dark:border-slate-800/80 text-xs">
                                  <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-mono font-medium text-slate-700 dark:text-slate-200">${sess.dayOfWeek}, ${formatShortDate(sess.dateISO)} · ${sess.startTime}–${sess.endTime} (${sess.duration}h)</span>
                                    <span class="px-1.5 py-0.5 text-[10px] rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(sess.classType)}</span>
                                    ${effectiveMode === 'free' ? `
                                      <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-50 dark:bg-blue-950/70 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800">FREE (Excluded)</span>
                                    ` : effectiveMode === 'excluded' ? `
                                      <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700">EXCLUDED (Not Counted)</span>
                                    ` : `
                                      <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">NORMAL (${sess.normalStatus})</span>
                                    `}
                                    <span class="text-[11px] text-slate-400">(Saved status: ${sess.normalStatus})</span>
                                  </div>

                                  <div class="flex items-center gap-1 shrink-0">
                                    <span class="text-[10px] text-slate-400 mr-1">Class override:</span>
                                    <button type="button" onclick="setHolidayClassOverride('${activeHoliday.id}', '${sess.key}', 'free')" class="px-2 py-0.5 rounded text-[11px] border ${

                                    }">Exclude</button>
                                    <button type="button" onclick="setHolidayClassOverride('${activeHoliday.id}', '${sess.key}', 'normal')" class="px-2 py-0.5 rounded text-[11px] border ${
                                      effectiveMode === 'normal' ? 'bg-emerald-600 text-white border-emerald-600 font-semibold' : 'border-slate-200 dark:border-slate-700 text-slate-500'
                                    }">Normal</button>
                                  </div>
                                </div>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `}
              </div>
            `}
          </div>
        </div>

     * INTERACTIVE HANDLERS & STATE MUTATORS
     ********************************************************************/
    function selectGradeSubject(subjectId) {
      selectedGradeSubjectId = subjectId;
      renderApp();
    }

    function selectAttendanceSubject(subjectId) {
      selectedAttendanceSubjectId = subjectId;
      renderApp();
    }

    function selectHoliday(holidayId) {
      selectedHolidayId = holidayId;
      renderApp();
    }

    function changeCalendarWeek(weekNum) {
      const totalWeeks = Math.max(1, Number(appState.semester.weeks) || 10);
      selectedCalendarWeek = Math.max(1, Math.min(totalWeeks, Number(weekNum)));
      renderApp();
    }

    // Inline edit assessment score or weight
    function updateAssessmentInline(subjectId, compId, assId, field, rawValue) {
      const subj = appState.subjects.find(s => s.id === subjectId);
      if (!subj) return;
      const comp = subj.components.find(c => c.id === compId);
      if (!comp) return;
      const ass = comp.assessments.find(a => a.id === assId);
      if (!ass) return;

      if (field === 'score') {
        if (rawValue === '' || rawValue === null) {
          ass.score = null;
          saveState(`Marked "${ass.name}" as Pending`);
        } else {
          const val = Number(rawValue);
          if (Number.isNaN(val) || val < 0 || val > 100) {
            showToast('Score must be between 0% and 100%', 'error');
            renderApp();
            return;
          }
          ass.score = round2(val);
          saveState(`Updated "${ass.name}" score to ${ass.score}%`);
        }
      } else if (field === 'weight') {
        const val = Number(rawValue);
        if (Number.isNaN(val) || val < 0 || val > 100) {
          showToast('Assessment weight must be between 0% and 100%', 'error');
          renderApp();
          return;
        }
        ass.weight = round2(val);
        saveState(`Updated "${ass.name}" weight to ${ass.weight}%`);
      }
      renderApp();
    }

    // Scenario calculator controls
    function setScenarioPreset(subjectId, scoreVal) {
      scenarioState[subjectId] = {
        uniformScore: Number(scoreVal),
        assessmentOverrides: {}
      };
      renderApp();
    }

    function updateScenarioOverride(subjectId, assId, scoreVal) {
      if (!scenarioState[subjectId]) {
        scenarioState[subjectId] = { uniformScore: 80, assessmentOverrides: {} };
      }
      const clamped = Math.max(0, Math.min(100, Number(scoreVal) || 0));
      scenarioState[subjectId].assessmentOverrides[assId] = clamped;
      renderApp();
    }

    function resetScenario(subjectId) {
      scenarioState[subjectId] = { uniformScore: 80, assessmentOverrides: {} };
      renderApp();
    }

    // Update session attendance status
    function updateSessionStatus(sessionKey, newStatus) {
      appState.attendanceRecords[sessionKey] = newStatus;
      saveState(`Attendance updated to ${newStatus}`);
      renderApp();
    }

    // Holiday rule mutators
    function setHolidaySubjectRule(holidayId, subjectId, mode) {
      const hol = appState.holidays.find(h => h.id === holidayId);
      if (!hol) return;
      if (!hol.subjectSettings) hol.subjectSettings = {};
      hol.subjectSettings[subjectId] = mode;

      // Clear individual class overrides for this subject on this holiday so subject rule applies cleanly
      if (hol.classOverrides) {
        const subjSlots = new Set(appState.timetable.filter(t => t.subjectId === subjectId).map(t => t.id));
        Object.keys(hol.classOverrides).forEach(k => {
          const [slotId] = k.split('__');
          if (subjSlots.has(slotId)) {
            delete hol.classOverrides[k];
          }
        });
      }

      saveState(`Updated holiday setting to ${mode.toUpperCase()}`);
      renderApp();
    }

    function setHolidayClassOverride(holidayId, sessionKey, mode) {
      const hol = appState.holidays.find(h => h.id === holidayId);
      if (!hol) return;
      if (!hol.classOverrides) hol.classOverrides = {};
      hol.classOverrides[sessionKey] = mode;
      saveState(`Updated class holiday rule to ${mode.toUpperCase()}`);
      renderApp();
    }

    function applyHolidayRuleToAll(holidayId, mode) {
      const hol = appState.holidays.find(h => h.id === holidayId);
      if (!hol) return;
      hol.subjectSettings = {};
      appState.subjects.forEach(s => {
        hol.subjectSettings[s.id] = mode;
      });
      hol.classOverrides = {};
      saveState(`Applied ${mode.toUpperCase()} to all subjects on "${hol.name}"`);
      renderApp();
    }

    /********************************************************************

    function openModal(html) {
      const backdrop = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');
      if (!backdrop || !content) return;
      content.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    // Close modal when clicking backdrop outside dialog
    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });

    // 1. Add / Edit Subject Modal
    function openAddSubjectModal() {
      openModal(`

                <option value="custom">Single Component (100% — Customize Manually)</option>
              </select>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-3.5 py-2 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700">Cancel</button>

            </div>
          </form>
        </div>
      `);

    function handleAddSubjectSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('inputSubjectName').value.trim();
      const tpl = document.getElementById('inputSubjectTemplate').value;
      if (!name) return;

      // Prevent duplicate subject names
      if (appState.subjects.some(s => s.name.toLowerCase() === name.toLowerCase())) {
        showToast('A subject with this name already exists', 'error');
        return;
      }

      let components = [];
      if (tpl === 'standard') {
        components = [
          { id: uid('comp'), name: 'Reg Mid', weight: 30, assessments: [{ id: uid('ass'), name: 'Midterm', score: null, weight: 60 }, { id: uid('ass'), name: 'Quiz / Assignment', score: null, weight: 40 }] },
          { id: uid('comp'), name: 'Reg End', weight: 30, assessments: [{ id: uid('ass'), name: 'Endterm', score: null, weight: 60 }, { id: uid('ass'), name: 'Practice / Lab', score: null, weight: 40 }] },
          { id: uid('comp'), name: 'Final Exam', weight: 40, assessments: [{ id: uid('ass'), name: 'Final Exam', score: null, weight: 100 }] }
        ];
      } else if (tpl === 'project') {
        components = [
          { id: uid('comp'), name: 'Coursework & Labs', weight: 25, assessments: [{ id: uid('ass'), name: 'Labs 1–5', score: null, weight: 100 }] },
          { id: uid('comp'), name: 'Midterm Milestone', weight: 25, assessments: [{ id: uid('ass'), name: 'Midterm Review', score: null, weight: 100 }] },
          { id: uid('comp'), name: 'Endterm Milestone', weight: 20, assessments: [{ id: uid('ass'), name: 'Endterm Review', score: null, weight: 100 }] },
          { id: uid('comp'), name: 'Final Project Defense', weight: 30, assessments: [{ id: uid('ass'), name: 'Final Defense', score: null, weight: 100 }] }
        ];
      } else {
        components = [
          { id: uid('comp'), name: 'Course Component 1', weight: 100, assessments: [{ id: uid('ass'), name: 'Assessment 1', score: null, weight: 100 }] }
        ];
      }

      const newSubj = { id: uid('subj'), name, components };
      appState.subjects.push(newSubj);
      selectedGradeSubjectId = newSubj.id;
      selectedAttendanceSubjectId = newSubj.id;
      closeModal();
      saveState(`Added subject "${name}"`, 'success');
      renderApp();
    }

          <h3 class="text-base font-bold text-slate-900 dark:text-white">Delete "${escapeHtml(subj.name)}"?</h3>

          </div>
        </div>
      `);

    function executeDeleteSubject(subjectId) {
      const subj = appState.subjects.find(s => s.id === subjectId);
      const name = subj ? subj.name : 'Subject';
      appState.subjects = appState.subjects.filter(s => s.id !== subjectId);

      closeModal();
      saveState(`Deleted "${name}"`);
      renderApp();
    }

      openModal(`

          <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">

    function setSingleSessionSpecialRule(sessionKey, dateISO, subjectId, mode) {
      let hol = appState.holidays.find(h => dateISO >= h.startDate && dateISO <= h.endDate);
      if (!hol && mode !== 'normal') {
        hol = {
          id: uid('hol'),
          name: `Special Class Rule (${formatShortDate(dateISO)})`,
          category: mode === 'free' ? 'Independent Study Day' : 'Cancelled Classes',
          startDate: dateISO,
          endDate: dateISO,
          subjectSettings: {},
          classOverrides: {}
        };
        appState.holidays.push(hol);
      }
      if (hol) {
        if (!hol.classOverrides) hol.classOverrides = {};
        hol.classOverrides[sessionKey] = mode;
      }
      saveState(`Updated class rule to ${mode.toUpperCase()}`);
      renderApp();
      openSessionDetailModal(sessionKey);
    }

    function recalcModalEndDate() {
      const w = Math.max(1, Math.min(24, Number(document.getElementById('semWeeks').value) || 10));
      const start = document.getElementById('semStartDate').value;
      if (start) {
        const mon = getMondayOfISO(start);
        const endSat = addDaysISO(mon, w * 7 - 2);
        document.getElementById('semEndDate').value = endSat;
      }
    }

      e.preventDefault();
      const weeks = Math.max(1, Math.min(24, Number(document.getElementById('semWeeks').value) || 10));
      const startDate = document.getElementById('semStartDate').value;
      const endDate = document.getElementById('semEndDate').value;
      if (endDate < startDate) {
        showToast('Semester end date must be after start date', 'error');
        return;
      }
      appState.semester.weeks = weeks;
      appState.semester.startDate = startDate;
      appState.semester.endDate = endDate;
      closeModal();
      saveState(`Updated semester to ${weeks} weeks (${startDate} to ${endDate})`, 'success');
      renderApp();
    }

                </div>
              ` : `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Email Address</label>
                    <input type="email" id="sbAuthEmail" placeholder="student@astanait.edu.kz" value="${escapeHtml(supabaseConfig.studentId && supabaseConfig.studentId.includes('@') ? supabaseConfig.studentId : '')}" class="w-full px-2.5 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-[#14171C] text-xs" />
                  </div>
                  <div>
                    <label class="block text-[10px] font-medium text-slate-500 mb-0.5">Password (min 6 chars)</label>
                    <input type="password" id="sbAuthPassword" placeholder="••••••••" class="w-full px-2.5 py-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-[#14171C] text-xs" />
                  </div>
                </div>
                <div class="flex items-center gap-2 pt-1">
                  <button type="button" onclick="handleSupabaseAuthAction('signin')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 hover:bg-slate-800">
                    Sign In
                  </button>
                  <button type="button" onclick="handleSupabaseAuthAction('signup')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">
                    Create Account (Sign Up)
                  </button>
                </div>
              `}
            </div>

            <div class="hidden">
              <label class="block text-[11px] font-medium text-slate-600 dark:text-slate-300 mb-1">Sync Profile Key (Auto-filled with your Email when signed in)</label>
              <input type="text" id="sbStudentId" required placeholder="e.g., student@astanait.edu.kz" value="${escapeHtml((currentAuthUser && currentAuthUser.email) || supabaseConfig.studentId || 'aitu_student_01')}" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#1C2026] text-xs font-mono" />
            </div>

            <div class="hidden">
              <button type="submit" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700">
                Save & Push to Supabase
              </button>
              <button type="button" onclick="handlePullSupabaseClick()" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#1C2026] hover:bg-slate-100">
                Pull from Cloud
              </button>
              <button type="button" onclick="copySupabaseSql()" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-blue-600 dark:text-blue-400 hover:underline ml-auto">
                Copy SQL Setup Script
              </button>
            </div>
            <textarea id="sbSqlHidden" class="hidden" readonly>${escapeHtml(sqlSchema)}</textarea>
          </form>

          <div class="space-y-2 pt-1 border-t border-slate-100 dark:border-slate-800">
            <div class="text-xs font-semibold text-slate-500">Local Presets</div>
            <button type="button" onclick="resetToDemoData()" class="w-full py-2 px-3.5 rounded-lg text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-left flex items-center justify-between">
              <span>Restore Sample AITU Trimester Data</span>
              <span class="text-slate-400">4 Subjects + Timetable</span>
            </button>
            <button type="button" onclick="clearAllStudentData()" class="w-full py-2 px-3.5 rounded-lg text-xs font-semibold border border-rose-200 dark:border-rose-900/60 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-left flex items-center justify-between">
              <span>Clear All Data & Start Blank</span>
              <span>Reset</span>
            </button>
          </div>
          <div class="flex justify-end pt-1">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700">Close</button>
          </div>
        </div>
      `);
    }

    async function handleSaveSupabaseConfig(e) {
      e.preventDefault();
      const url = document.getElementById('sbUrl').value.trim();
      const anonKey = document.getElementById('sbAnonKey').value.trim();
      const studentId = document.getElementById('sbStudentId').value.trim() || 'aitu_student_01';
      const enabled = document.getElementById('sbEnabled').checked;
      saveSupabaseConfig({ url, anonKey, studentId, enabled });
      if (url && anonKey) {
        await pushStateToSupabase(false);
      } else {
        showToast('Saved Supabase settings locally');
      }
    }

    async function handlePullSupabaseClick() {
      const url = document.getElementById('sbUrl').value.trim();
      const anonKey = document.getElementById('sbAnonKey').value.trim();
      const studentId = document.getElementById('sbStudentId').value.trim() || 'aitu_student_01';
      const enabled = document.getElementById('sbEnabled').checked;
      saveSupabaseConfig({ url, anonKey, studentId, enabled });
      await pullStateFromSupabase(false);
    }

    function copySupabaseSql() {
      const el = document.getElementById('sbSqlHidden');
      if (!el) return;
      el.classList.remove('hidden');
      el.select();
      try {
        document.execCommand('copy');
        showToast('Copied Supabase SQL table script to clipboard!', 'success');
      } catch (err) {
        showToast('Could not copy automatically', 'error');
      }
      el.classList.add('hidden');
    }

    function resetToDemoData() {
      const currentTheme = appState.theme;
      appState = getDefaultState();
      appState.theme = currentTheme;
      selectedGradeSubjectId = appState.subjects[0].id;
      selectedAttendanceSubjectId = appState.subjects[0].id;
      selectedCalendarWeek = 8;
      closeModal();
      saveState('Restored sample AITU student dataset', 'success');
      renderApp();
    }

    function clearAllStudentData() {
      const currentTheme = appState.theme;
      appState = {
        theme: currentTheme,
        semester: { weeks: 10, startDate: '2026-09-21', endDate: '2026-11-28', referenceDate: TODAY_ISO },
        subjects: [],
        timetable: [],
        holidays: [],
        attendanceRecords: {}
      };
      selectedGradeSubjectId = null;
      selectedAttendanceSubjectId = null;
      selectedHolidayId = null;
      closeModal();
      saveState('Cleared all student data');
      renderApp();
    }

    async function handleSupabaseAuthAction(mode) {
      const urlEl = document.getElementById('sbUrl');
      const keyEl = document.getElementById('sbAnonKey');
      const emailEl = document.getElementById('sbAuthEmail');
      const passEl = document.getElementById('sbAuthPassword');

      const url = DEFAULT_SUPABASE_URL;
      const anonKey = DEFAULT_SUPABASE_PUBLISHABLE_KEY;
      const email = emailEl ? emailEl.value.trim() : '';
      const password = passEl ? passEl.value : '';

      if (!url || !anonKey) {
        showToast('App connection is not configured.', 'error');
        return;
      }
      if (!email || !password || password.length < 6) {
        showToast('Enter a valid email and a password of at least 6 characters', 'error');
        return;
      }

      saveSupabaseConfig({ url, anonKey, studentId: email, enabled: true });
      const client = await initSupabaseClient();
      if (!client) {
        showToast('Could not initialize Supabase client — verify URL and Anon Key', 'error');
        return;
      }

      try {
        if (mode === 'signup') {
          const { data, error } = await client.auth.signUp({ email, password });
          if (error) throw error;
          if (data?.session?.user) {
            currentAuthUser = data.session.user;
            activateAccountState(currentAuthUser);
            saveSupabaseConfig({ studentId: email, enabled: true });
            await pushStateToSupabase(false);
            subscribeToRealtimeSync();
            showToast('Account created and signed in!', 'success');
          } else {
            currentAuthUser = null;
            saveSupabaseConfig({ studentId: '', enabled: false });
            showToast('Check your email, confirm the account, then sign in.', 'info');
          }
          openDataMenuModal();
        } else {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (data?.user) {
            currentAuthUser = data.user;
            activateAccountState(currentAuthUser);
            saveSupabaseConfig({ studentId: email, enabled: true });
            await pullStateFromSupabase(false);
            subscribeToRealtimeSync();
            showToast(`Signed in as ${email}!`, 'success');
            openDataMenuModal();
          }
        }
      } catch (err) {
        showToast(err.message || 'Authentication failed', 'error');
      }
    }

    async function handleSupabaseSignOut() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      if (currentAuthUser?.id) localStorage.setItem(USER_STATE_PREFIX + currentAuthUser.id, JSON.stringify(appState));
      currentAuthUser = null;
      if (syncTimeoutId) clearTimeout(syncTimeoutId);
      localStorage.setItem(ACCOUNT_OWNER_KEY, 'signed_out');
      appState = getDefaultState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      renderApp();
      if (realtimeChannel && supabaseClient) supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
      saveSupabaseConfig({ studentId: '', enabled: false });
      showToast('Signed out of cloud account');
      openDataMenuModal();
    }

    // Boot Application on Load
    window.addEventListener('DOMContentLoaded', async () => {
      switchTab('dashboard');
      await initSupabaseClient();
      if (currentAuthUser?.id) await pullStateFromSupabase(true);
    });
  </script>
</body>
</html>
